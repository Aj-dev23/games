 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skybound Adventure</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080e20;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game-container {
  width: min(960px, 100%);
  padding: 16px;
  text-align: center;
}

h1 {
  color: #5de8ff;
  text-shadow: 0 0 20px #00bfff;
  letter-spacing: 3px;
}

.hud {
  display: flex;
  justify-content: space-around;
  padding: 12px;
  background: #172443;
  border-radius: 12px 12px 0 0;
  font-weight: bold;
}

canvas {
  width: 100%;
  display: block;
  background: #14203c;
  border: 3px solid #405b94;
  border-radius: 0 0 12px 12px;
}

.controls {
  margin-top: 12px;
  color: #aab9d8;
}

button {
  padding: 12px 24px;
  margin: 6px;
  background: #00c6ff;
  color: #071020;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #76e7ff; }

.touch-controls {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
}

.touch-controls button {
  font-size: 22px;
  touch-action: none;
  user-select: none;
}
</style>
</head>
<body>

<div class="game-container">
  <h1>SKYBOUND ADVENTURE</h1>

  <div class="hud">
    <span id="level">Level: 1</span>
    <span id="score">Score: 0</span>
    <span id="lives">Lives: 3</span>
  </div>

  <canvas id="game" width="900" height="500"></canvas>

  <div class="controls">
    A / D or Arrow Keys = Move |
    Space / W / Up = Jump |
    P = Pause
  </div>

  <button onclick="startGame()">Start / Restart</button>

  <div class="touch-controls">
    <div>
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>
    <button id="jump">JUMP</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const GRAVITY = 0.55;

let keys = {};
let player;
let platforms = [];
let coins = [];
let enemies = [];
let portal;
let level = 1;
let score = 0;
let lives = 3;
let running = false;
let paused = false;
let gameOver = false;
let won = false;
let invincible = 0;
let frame = 0;

const levels = [
  {
    platforms: [
      [0, 455, 900, 45],
      [110, 370, 130, 20],
      [300, 300, 140, 20],
      [510, 245, 130, 20],
      [710, 350, 130, 20]
    ],
    coins: [
      [160, 330], [350, 260],
      [560, 205], [770, 310]
    ],
    enemies: [[420, 425, 350, 650]]
  },
  {
    platforms: [
      [0, 455, 250, 45],
      [340, 455, 250, 45],
      [680, 455, 220, 45],
      [180, 360, 120, 20],
      [380, 290, 130, 20],
      [600, 350, 120, 20],
      [730, 230, 120, 20]
    ],
    coins: [
      [210, 320], [430, 250],
      [650, 310], [780, 190],
      [440, 415]
    ],
    enemies: [
      [390, 425, 340, 570],
      [710, 425, 680, 870]
    ]
  },
  {
    platforms: [
      [0, 455, 200, 45],
      [270, 455, 180, 45],
      [520, 455, 380, 45],
      [120, 360, 100, 20],
      [290, 290, 110, 20],
      [470, 230, 120, 20],
      [650, 300, 110, 20],
      [780, 210, 100, 20]
    ],
    coins: [
      [160, 320], [340, 250],
      [520, 190], [700, 260],
      [825, 170], [590, 415]
    ],
    enemies: [
      [300, 425, 270, 440],
      [580, 425, 520, 880],
      [680, 270, 650, 740]
    ]
  }
];

function makePlayer() {
  return {
    x: 35,
    y: 370,
    w: 32,
    h: 42,
    vx: 0,
    vy: 0,
    speed: 4.5,
    jump: -12,
    grounded: false
  };
}

function loadLevel() {
  const data = levels[level - 1];

  player = makePlayer();

  platforms = data.platforms.map(p => ({
    x: p[0], y: p[1],
    w: p[2], h: p[3]
  }));

  coins = data.coins.map(c => ({
    x: c[0], y: c[1],
    collected: false
  }));

  enemies = data.enemies.map(e => ({
    x: e[0],
    y: e[1],
    startY: e[1],
    min: e[2],
    max: e[3],
    w: 30,
    h: 30,
    vx: 1.5,
    alive: true
  }));

  portal = {
    x: 830,
    y: 375,
    w: 40,
    h: 80
  };

  invincible = 80;
  updateHUD();
}

function startGame() {
  level = 1;
  score = 0;
  lives = 3;
  running = true;
  paused = false;
  gameOver = false;
  won = false;
  keys = {};
  loadLevel();
}

function updateHUD() {
  document.getElementById("level").textContent =
    "Level: " + level;
  document.getElementById("score").textContent =
    "Score: " + score;
  document.getElementById("lives").textContent =
    "Lives: " + lives;
}

function collision(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function hurt() {
  if (invincible > 0 || !running) return;

  lives--;
  updateHUD();

  if (lives <= 0) {
    running = false;
    gameOver = true;
  } else {
    player = makePlayer();
    invincible = 100;
  }
}

function nextLevel() {
  level++;

  if (level > levels.length) {
    running = false;
    won = true;
  } else {
    loadLevel();
  }
}

function update() {
  if (!running || paused) return;

  frame++;

  if (invincible > 0) invincible--;

  player.vx = 0;

  if (keys["ArrowLeft"] || keys["a"]) {
    player.vx = -player.speed;
  }

  if (keys["ArrowRight"] || keys["d"]) {
    player.vx = player.speed;
  }

  if (
    (keys[" "] || keys["ArrowUp"] || keys["w"]) &&
    player.grounded
  ) {
    player.vy = player.jump;
    player.grounded = false;
  }

  player.x += player.vx;
  player.x = Math.max(
    0, Math.min(W - player.w, player.x)
  );

  const previousBottom = player.y + player.h;

  player.vy += GRAVITY;
  player.y += player.vy;
  player.grounded = false;

  for (const p of platforms) {
    if (
      collision(player, p) &&
      player.vy >= 0 &&
      previousBottom <= p.y + 12
    ) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  if (player.y > H + 50) {
    hurt();
  }

  for (const coin of coins) {
    if (coin.collected) continue;

    const box = {
      x: coin.x - 12,
      y: coin.y - 12,
      w: 24,
      h: 24
    };

    if (collision(player, box)) {
      coin.collected = true;
      score += 100;
      updateHUD();
    }
  }

  for (const enemy of enemies) {
    if (!enemy.alive) continue;

    enemy.x += enemy.vx;

    if (enemy.x <= enemy.min ||
        enemy.x + enemy.w >= enemy.max) {
      enemy.vx *= -1;
    }

    if (collision(player, enemy)) {
      const stomp =
        player.vy > 0 &&
        previousBottom <= enemy.y + 12;

      if (stomp) {
        enemy.alive = false;
        player.vy = -8;
        score += 200;
        updateHUD();
      } else {
        hurt();
      }
    }
  }

  const allCoins = coins.every(c => c.collected);

  if (allCoins && collision(player, portal)) {
    nextLevel();
  }
}

function roundedRect(x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

function drawBackground() {
  const gradient = ctx.createLinearGradient(
    0, 0, 0, H
  );
  gradient.addColorStop(0, "#101c40");
  gradient.addColorStop(1, "#334b85");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (let i = 0; i < 55; i++) {
    const x = (i * 137 + 39) % W;
    const y = (i * 83 + 17) % 350;

    ctx.fillStyle = "#ffffff88";
    ctx.fillRect(x, y, 2, 2);
  }

  // Distant mountains
  ctx.fillStyle = "#1b3059";
  ctx.beginPath();
  ctx.moveTo(0, 455);
  ctx.lineTo(130, 310);
  ctx.lineTo(280, 455);
  ctx.lineTo(430, 280);
  ctx.lineTo(610, 455);
  ctx.lineTo(760, 320);
  ctx.lineTo(900, 455);
  ctx.fill();
}

function drawPlatforms() {
  for (const p of platforms) {
    roundedRect(
      p.x, p.y, p.w, p.h,
      5, "#354e78"
    );

    ctx.fillStyle = "#48e5a4";
    ctx.fillRect(p.x, p.y, p.w, 7);
  }
}

function drawCoins() {
  for (const coin of coins) {
    if (coin.collected) continue;

    const bounce = Math.sin(frame * 0.08) * 4;

    ctx.save();
    ctx.shadowColor = "#ffe45e";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#ffd84d";

    ctx.beginPath();
    ctx.arc(
      coin.x,
      coin.y + bounce,
      11,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "#fff5b1";
    ctx.fillRect(
      coin.x - 2,
      coin.y - 6 + bounce,
      4,
      12
    );
    ctx.restore();
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;

    roundedRect(
      e.x, e.y, e.w, e.h,
      8, "#ff5678"
    );

    ctx.fillStyle = "white";
    ctx.fillRect(e.x + 6, e.y + 8, 6, 6);
    ctx.fillRect(e.x + 19, e.y + 8, 6, 6);

    ctx.fillStyle = "#14203c";
    ctx.fillRect(e.x + 8, e.y + 10, 3, 3);
    ctx.fillRect(e.x + 21, e.y + 10, 3, 3);
  }
}

function drawPlayer() {
  if (invincible > 0 && frame % 8 < 4) {
    return;
  }

  ctx.save();
  ctx.shadowColor = "#40d9ff";
  ctx.shadowBlur = 12;

  roundedRect(
    player.x,
    player.y,
    player.w,
    player.h,
    7,
    "#25c9ff"
  );

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(player.x + 7, player.y + 10, 6, 7);
  ctx.fillRect(player.x + 20, player.y + 10, 6, 7);

  ctx.fillStyle = "#132442";
  ctx.fillRect(player.x + 9, player.y + 12, 3, 4);
  ctx.fillRect(player.x + 22, player.y + 12, 3, 4);

  ctx.fillStyle = "#14203c";
  ctx.fillRect(player.x + 10, player.y + 30, 13, 3);

  ctx.restore();
}

function drawPortal() {
  const unlocked = coins.every(c => c.collected);

  ctx.save();
  ctx.shadowColor = unlocked
    ? "#8b5cff"
    : "#777777";
  ctx.shadowBlur = unlocked ? 25 : 4;

  roundedRect(
    portal.x,
    portal.y,
    portal.w,
    portal.h,
    18,
    unlocked ? "#9a65ff" : "#555d75"
  );

  roundedRect(
    portal.x + 9,
    portal.y + 9,
    portal.w - 18,
    portal.h - 18,
    12,
    unlocked ? "#351b83" : "#283047"
  );

  ctx.restore();

  ctx.font = "14px Arial";
  ctx.textAlign = "center";
  ctx.fillStyle = "white";
  ctx.fillText(
    unlocked ? "EXIT" : "LOCKED",
    portal.x + 20,
    portal.y - 12
  );
}

function overlay(title, subtitle) {
  ctx.fillStyle = "rgba(4, 9, 25, 0.82)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#65e6ff";
  ctx.font = "bold 52px Arial";
  ctx.fillText(title, W / 2, 210);

  ctx.fillStyle = "white";
  ctx.font = "22px Arial";
  ctx.fillText(subtitle, W / 2, 260);
}

function draw() {
  drawBackground();
  drawPlatforms();
  drawCoins();
  drawEnemies();
  drawPortal();
  drawPlayer();

  if (!running && !gameOver && !won) {
    overlay(
      "SKYBOUND ADVENTURE",
      "Press Enter or Start to play"
    );
  }

  if (paused && running) {
    overlay("PAUSED", "Press P to resume");
  }

  if (gameOver) {
    overlay(
      "GAME OVER",
      "Final Score: " + score +
      " — Press Enter to retry"
    );
  }

  if (won) {
    overlay(
      "YOU WIN!",
      "Final Score: " + score +
      " — Press Enter to play again"
    );
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

window.addEventListener("keydown", e => {
  if (
    ["ArrowUp", "ArrowDown", "ArrowLeft",
     "ArrowRight", " "].includes(e.key)
  ) {
    e.preventDefault();
  }

  keys[e.key.toLowerCase()] = true;
  keys[e.key] = true;

  if (e.key === "Enter" && !running) {
    startGame();
  }

  if (e.key.toLowerCase() === "p" && running) {
    if (!e.repeat) paused = !paused;
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
  keys[e.key] = false;
});

window.addEventListener("blur", () => {
  keys = {};
  if (running) paused = true;
});

function bindTouch(id, key) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    keys[key] = true;
  });

  function release(e) {
    keys[key] = false;
  }

  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
}

bindTouch("left", "ArrowLeft");
bindTouch("right", "ArrowRight");
bindTouch("jump", " ");

loadLevel();
gameLoop();
</script>

</body>
</html>
